<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">A new reporting capability built from the ground up</title><desc id="desc">The organization had operational workflows but no unified analytics layer. Cloud Run processes the data in approximately two minutes, BigQuery stores analytical data, and Power BI refresh takes approximately ten to fifteen minutes. Owners can explore the numbers in detail. These are reported stage timings, not a guaranteed total or time-savings comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#77637f"/></marker></defs>
<rect width="1800" height="1100" fill="#faf7f2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#4a3d48">
<text x="70" y="90" font-size="47" font-weight="700">From operational records to management visibility</text>
<text x="72" y="143" font-size="25" fill="#665d62">Healthcare analytics · Anonymized architecture illustration</text>
<rect x="70" y="195" width="620" height="700" rx="22" fill="#fffdf9" stroke="#d8cedc" stroke-width="2"/>
<rect x="110" y="232" width="540" height="69" rx="10" fill="#eee5e1"/>
<text x="135" y="278" font-size="30" font-weight="700">BEFORE / operational tools</text>
<text x="115" y="365" font-size="32" font-weight="700">Digital workflows already existed</text>
<g font-size="27" fill="#665d62"><text x="115" y="425">Treatment coordination</text><text x="115" y="480">Funding and billing activity</text><text x="115" y="535">Team handoffs and task records</text><text x="115" y="590">Information held across tools</text></g>
<path d="M115 640H645" stroke="#d8cedc" stroke-width="2"/>
<text x="115" y="705" font-size="30" font-weight="700">What was missing?</text>
<g font-size="27" fill="#665d62"><text x="115" y="760">An established, end-to-end</text><text x="115" y="802">analytics and management</text><text x="115" y="844">reporting layer.</text></g>
<rect x="745" y="195" width="985" height="700" rx="22" fill="#fffdf9" stroke="#d8cedc" stroke-width="2"/>
<rect x="785" y="232" width="905" height="69" rx="10" fill="#e9dfee"/>
<text x="812" y="278" font-size="30" font-weight="700">BUILT / a new reporting capability</text>
<rect x="795" y="330" width="885" height="125" rx="13" fill="#f4edf5" stroke="#d8cedc"/>
<text x="823" y="376" font-size="31" font-weight="700">Google Cloud Run</text><text x="823" y="419" font-size="25" fill="#665d62">Extraction, processing and validation · ~2 min reported</text>
<path d="M1235 458V483" stroke="#77637f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="795" y="495" width="885" height="125" rx="13" fill="#f4edf5" stroke="#d8cedc"/>
<text x="823" y="541" font-size="31" font-weight="700">Google BigQuery</text><text x="823" y="584" font-size="25" fill="#665d62">Centralized analytical data from six workflow stages</text>
<path d="M1235 623V648" stroke="#77637f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="795" y="660" width="885" height="125" rx="13" fill="#f4edf5" stroke="#d8cedc"/>
<text x="823" y="706" font-size="31" font-weight="700">Power BI</text><text x="823" y="749" font-size="25" fill="#665d62">Semantic model and report refresh · ~10–15 min reported</text>
<text x="800" y="843" font-size="27" font-weight="700">Owners can filter, drill down and drill through.</text>
<rect x="70" y="930" width="1660" height="118" rx="18" fill="#e9dfee"/>
<text x="105" y="973" font-size="27" font-weight="700">Business value: a unified analytical view that did not previously exist.</text>
<text x="105" y="1017" font-size="23" fill="#665d62">Approximate stage timings may vary. No verified total refresh time, time savings, or financial ROI is claimed.</text>
